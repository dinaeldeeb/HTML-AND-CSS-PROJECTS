
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creating CSS Effects - Dina Eldeeb</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="navbar">
    <a href="#home" class="home-link">HOME</a>

    <div class="dropdown">
      <a href="#gallery" class="dropdown-btn">IMAGES</a>

      <div class="dropdown-content">
        <a href="#image1">IMAGE 1</a>
        <a href="#image2">IMAGE 2</a>
        <a href="#image3">IMAGE 3</a>
      </div>
    </div>
  </nav>

  <header id="home">
    <h1>Creating CSS Effects</h1>
    <p>Explore beautiful Egyptian scenery with interactive CSS effects.</p>
  </header>

  <section id="gallery" class="gallery">

    <div class="image-container" id="image1">
      <img class="zoom" src="images/egypt-one.jpg.JPG" alt="Egyptian scenery - Zoom Effect">
      <div class="overlay">Egypt - Zoom Effect</div>
    </div>

    <div class="image-container" id="image2">
      <img class="rotate" src="images/egypt-two.jpg.JPG" alt="Egyptian scenery - Rotate Effect">
      <div class="overlay">Egypt - Rotate Effect</div>
    </div>

    <div class="image-container" id="image3">
      <img class="grayscale" src="images/egypt-three.jpg.WEBP" alt="Egyptian scenery - Color Effect">
      <div class="overlay">Egypt - Color Effect</div>
    </div>

  </section>

  <footer>
    <p>Created by Dina Eldeeb | CSS Effects Challenge</p>
  </footer>

</body>
</html>
